<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sneakers site</title>
		<!-- CSS -->
		<link rel="stylesheet" href="css/main.css" />
		<!-- ICON -->
		<link rel="icon" href="images/header/icon-img.svg" />
	</head>
	<body>
		<!-- HEADER START -->
		<header class="header">
			<div class="container">
				<img class="menu__btn" src="images/header/menu.svg" alt="menu" />
				<div class="logo">
					<img src="images/header/logo.png" alt="logo" />
				</div>
				<nav class="header__nav">
					<img class="close__btn" src="images/header/close.svg" alt="close" />
					<a href="#">Collections</a>
					<a href="#">Men</a>
					<a href="#">Women</a>
					<a href="#">About</a>
					<a href="#">Contact</a>
				</nav>
				<div class="header__images">
					<img class="cart__icon" src="images/header/basket-img.svg" alt="basket-img" />
					<span class="cart-badge">0</span>
					<img class="user__img" src="images/header/icon-img.svg" alt="icon-img" />
					<div class="cart__box">
						<h3>Cart</h3>
						<div class="cart__content">
							<div class="cart__empty">Your cart is empty.</div>
						</div>
					</div>
				</div>
			</div>
		</header>
		<!-- HEADER END -->
		<hr />

		<!-- HERO START -->
		<section class="hero">
			<div class="hero__left">
				<img class="main-shoe-img" src="images/hero/Recsneaker big img.png" alt="shoe-img" />
				<ul class="hero__list">
					<li class="hero__item">
						<img src="images/hero/Recsneaker big img.png" alt="shoe-1" />
					</li>
					<li class="hero__item">
						<img src="images/hero/shoe2-img.png" alt="shoe-2" />
					</li>
					<li class="hero__item">
						<img src="images/hero/shoe3-img.png" alt="shoe-3" />
					</li>
					<li class="hero__item">
						<img src="images/hero/shoe4-img.png" alt="shoe-4" />
					</li>
				</ul>
			</div>
			<div class="hero__right">
				<h1 class="right__title">Sneaker Company</h1>
				<h2 class="right__title2">Fall Limited Edition Sneakers</h2>
				<p class="right__text">
					These low-profile sneakers are your perfect casual wear companion. Featuring a durable rubber outer sole, they’ll
					withstand everything the weather can offer.
				</p>
				<div class="price">
					<div class="price__top">
						<span class="new__price">$125.00</span>
						<span class="sale">50%</span>
					</div>
					<span class="old__price">$250.00</span>
				</div>
				<div class="buttons">
					<div class="counter">
						<img class="minus-img" src="images/hero/minus.svg" alt="minus-img" />
						<span class="zero">0</span>
						<img class="plus-img" src="images/hero/plus.svg" alt="plus-img" />
					</div>
					<button class="btn2">
						<img src="images/header/basket-img.svg" alt="basket-img" />
						Add to cart
					</button>
				</div>
			</div>
		</section>
		<!-- HERO END -->
		<script src="js/main.js"></script>
	</body>
</html>
